id: 31
name: portfolio-evidence-api
program:
  id: backend-reliability-platform
  narrative_fit: Provides the shared evidence registry consumed by the public and operational portfolio consoles.
  shared_assets:
    - benchmark-result-v2
    - portfolio-evidence-openapi
    - portfolio-evidence-graphql
status: benchmarked
claim: Validates, stores, compares, and governs reproducible portfolio benchmark evidence through stable contracts.
stack:
  - nodejs-24
  - typescript
  - nestjs-11
  - fastify-5
  - graphql
  - mercurius
  - kysely
  - sqlite
  - ajv
  - prometheus
  - pino
  - vitest
language_profile:
  primary: node-typescript-backend
  secondary: []
  reason: The service needs strict contracts, dependency injection, HTTP throughput, and typed application boundaries.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: backend-reliability-platform
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: patched
  principles:
    coupling_rule: Domain and application code depend only on ports; Nest, SQL, validation, and transports remain outside.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: Use one deployable service and one local database until multi-writer evidence requires more.
    testability_rule: Every use case runs with in-memory test doubles and without Nest, HTTP, GraphQL, or SQLite.
    rejected_overengineering:
      - CQRS for three commands and three read queries
      - broker-backed workflows without asynchronous business pressure
      - cloud object storage before evidence artifacts require it
  stack_profile: node-typescript-backend
  api_style: graphql
  messaging: none
  cloud:
    mode: none
    local_provider: kumo
    real_provider_target: none
    emulated_services: []
    adapter_rule: If artifact storage becomes necessary, add a port and prove Kumo locally before an AWS adapter.
    config_switch: not-applicable-no-cloud-port
    unsupported_behaviors:
      - remote artifact storage
      - managed identity
  database: sqlite
  runtime: nodejs-24-lts
  library_policy: Fastify and Mercurius minimize HTTP and GraphQL overhead; Kysely keeps SQL explicit; Ajv enforces the shared schema.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Express
      reason: Fastify better fits the throughput benchmark while remaining a supported Nest adapter.
    - option: Apollo Server
      reason: Mercurius is native to Fastify and this service does not need Apollo federation.
    - option: PostgreSQL
      reason: A single local-first writer does not yet justify an external database process.
architecture:
  style: hexagonal
  reason: Audit commands and evidence queries need stable contracts while storage and transport remain independently replaceable.
  problem_forces:
    domain_complexity: medium
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: high
    throughput_or_async: medium
    independent_deployability: medium
  dependency_rule: Dependencies point from Nest, GraphQL, HTTP, Ajv, and SQLite adapters toward application ports and domain types.
  boundaries:
    - immutable benchmark evidence domain
    - ingestion and operational command use cases
    - read and comparison use cases
    - REST command adapters
    - GraphQL read adapter
    - SQLite persistence adapter
  rejected_alternatives:
    - style: mvc
      reason: Controller-model coupling would make protocol and persistence substitution harder to prove.
    - style: microservices
      reason: No bounded context needs independent deployment or asynchronous ownership yet.
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: '1.1.0'
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
    - contracts
benchmark:
  primary_metric: ingestion_p95_ms
  unit: ms
  command: docker run --rm portfolio-evidence-api benchmark
  result_path: benchmarks/results/latest.json
release:
  docker: node24-non-root-multi-stage
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
